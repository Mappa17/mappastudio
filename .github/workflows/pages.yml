name: Publish MAPPA Studio (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import approved image assets (first publication only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ ! -s assets/mappa-studio-hero-v2.webp ] || [ ! -s assets/mappa-studio-logo.png ]; then
            SHARE="https://mappa-studio-jhb4yfnjs-mappa3.vercel.app/?_vercel_share=DARPIMGjoJePS4RqbS1A52rEntMOryfv"
            HOST="https://mappa-studio-jhb4yfnjs-mappa3.vercel.app"
            curl -fLsS --retry 3 --max-time 40 -c /tmp/mappa-cookies "$SHARE" -o /tmp/mappa-auth.html
            curl -fLsS --retry 3 --max-time 50 -b /tmp/mappa-cookies -c /tmp/mappa-cookies "$HOST/assets/mappa-studio-hero-v2.webp" -o assets/mappa-studio-hero-v2.webp
            curl -fLsS --retry 3 --max-time 50 -b /tmp/mappa-cookies -c /tmp/mappa-cookies "$HOST/assets/mappa-studio-logo.png" -o assets/mappa-studio-logo.png
            test "$(wc -c < assets/mappa-studio-hero-v2.webp)" -gt 100000
            test "$(wc -c < assets/mappa-studio-logo.png)" -gt 20000
            test "$(head -c 4 assets/mappa-studio-hero-v2.webp)" = RIFF
            python3 - <<'PY'
          from pathlib import Path
          assert Path('assets/mappa-studio-logo.png').read_bytes().startswith(bytes([137,80,78,71,13,10,26,10]))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/mappa-studio-hero-v2.webp assets/mappa-studio-logo.png
            git commit -m "assets(site): add approved MAPPA Studio images" || true
            git push || true
          fi

      - name: Prepare static pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -R assets vision us gallery _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
