<!doctype html>
<html lang="it">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MAPPA Studio — paesaggi, visioni, persone, immagini.">
  <title>MAPPA Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/base.css">
</head>
<body class="home-page">
  <main class="hero-home" aria-label="Homepage MAPPA Studio">
    <div class="hero-canvas">
      <img class="hero-base" src="./assets/mappa-studio-hero-v2.webp" alt="Sezione paesaggistica illustrata di MAPPA Studio.">
      <div class="hero-soften" aria-hidden="true"></div>

      <div class="season-cycle" aria-hidden="true">
        <span class="season season-spring"></span>
        <span class="season season-summer"></span>
        <span class="season season-autumn"></span>
        <span class="season season-winter"></span>
      </div>

      <div class="precipitation precipitation-rain" aria-hidden="true"></div>
      <div class="precipitation precipitation-snow" aria-hidden="true"></div>

      <div class="subsurface-water" aria-hidden="true">
        <span class="groundwave groundwave-a"></span>
        <span class="groundwave groundwave-b"></span>
        <span class="groundwave groundwave-c"></span>
      </div>

      <div class="infiltration-zone" aria-hidden="true">
        <span class="infiltration infiltration-1"></span>
        <span class="infiltration infiltration-2"></span>
        <span class="infiltration infiltration-3"></span>
        <span class="infiltration infiltration-4"></span>
        <span class="infiltration infiltration-5"></span>
      </div>

      <div class="hero-graphics" aria-hidden="true">
        <img class="graphic graphic-photosynthesis" src="./assets/graphic-photosynthesis.svg" alt="">
        <img class="graphic graphic-ecosystem" src="./assets/graphic-ecosystem.svg" alt="">
        <img class="graphic graphic-nitrogen" src="./assets/graphic-nitrogen.svg" alt="">
        <img class="graphic graphic-water" src="./assets/graphic-water.svg" alt="">
        <img class="graphic graphic-nutrient" src="./assets/graphic-nutrient.svg" alt="">
      </div>

      <div class="hero-brand">
        <a href="./" class="brand-link" aria-label="MAPPA Studio Home">
          <img src="./assets/mappa-studio-logo.png" alt="MAPPA Studio" class="hero-logo">
        </a>
        <nav class="hero-nav" aria-label="Navigazione principale">
          <a href="./vision/">Vision</a>
          <a href="./us/">Us</a>
          <a href="./gallery/">Gallery</a>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
